<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Inter font for consistent typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa; /* Light background color */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; /* Full viewport height */
            padding: 20px;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px; /* Rounded corners for the container */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); /* Soft shadow */
            max-width: 600px; /* Max width for the form */
            width: 100%;
        }
        .form-label {
            font-weight: 500;
            color: #343a40;
        }
        .form-control, .form-select {
            border-radius: 8px; /* Rounded corners for input fields */
            padding: 10px 15px;
            border: 1px solid #ced4da;
        }
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
            border-radius: 8px; /* Rounded corners for button */
            padding: 10px 20px;
            font-weight: 600;
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0a58ca;
        }
        h1 { /* Style for the new header */
            color: #0d6efd; /* Bootstrap primary blue */
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 2.5rem; /* Larger font size */
            letter-spacing: 1px;
        }
        h2 {
            color: #343a40;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- New Header Added Here -->
        <h1>NetGen</h1>
        <h2 class="mb-4">User Contact Form</h2>
        <form id="registrationForm">
            <!-- Name Field -->
            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" name="name" placeholder="Enter your full name" required>
            </div>

            <!-- Email Field -->
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email address">
            </div>

            <!-- Phone Number Field -->
            <div class="mb-3">
                <label for="phoneNumber" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phoneNumber" name="phone" placeholder="e.g., +1 (123) 456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}|[0-9]{10}" title="Phone number should be 10 digits or in 123-456-7890 format" required>
                <small class="form-text text-muted">Format: 123-456-7890 or 1234567890</small>
            </div>

            <!-- Address Field -->
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter your full address" required></textarea>
            </div>

            <!-- Message Field -->
            <div class="mb-4">
                <label for="message" class="form-label">Additional Message (Optional)</label>
                <textarea class="form-control" id="message" name="message" rows="2" placeholder="Any additional information or message"></textarea>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    <span id="submitText">Register</span>
                    <span id="loadingSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
            </div>
        </form>
    </div>

    <!-- Bootstrap 5 JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Prevent default form submission
            
            // Get form elements
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            
            // Show loading state
            submitBtn.disabled = true;
            submitText.textContent = 'Submitting...';
            loadingSpinner.classList.remove('d-none');

            const queryString = window.location.search;

            // 2. Create a new URLSearchParams object
            const params = new URLSearchParams(queryString);

            // 3. Retrieve a specific parameter by its name
            // const name = params.get('name'); // Returns "John"
            // Get form data
            const formData = {
                userid: params.get('userid'), 
                name: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phoneNumber').value.trim(),
                address: document.getElementById('address').value.trim(),
                message: document.getElementById('message').value.trim()
            };
            
            try {
                // Submit form data to API
                const response = await fetch('/api/savecontact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    // Redirect to success page with contact ID
                    window.location.href = `/success?contact_id=${result.contact_id}`;
                } else {
                    // Show error message
                    alert('Error: ' + (result.error || 'Failed to submit form'));
                    
                    // Reset button state
                    submitBtn.disabled = false;
                    submitText.textContent = 'Register';
                    loadingSpinner.classList.add('d-none');
                }
            } catch (error) {
                // Handle network or other errors
                alert('Error: Failed to submit form. Please try again.');
                console.error('Form submission error:', error);
                
                // Reset button state
                submitBtn.disabled = false;
                submitText.textContent = 'Register';
                loadingSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
